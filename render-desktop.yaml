services:
  - type: web
    name: olufunmilyo-desktop-web-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix desktop-app/web-server
    startCommand: node desktop-app/web-server/server.cjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SETUP_KEY
        generateValue: true
